# Site settings
title: Land Nav
description: GPS and offline maps for iPhone and iPad. No ads. Privacy respected.
url: https://landnav.app
icon: /icon.png
start_year: 2023
author:
  name: Gerry Shaw
  email: gerry_shaw@yahoo.com
  url: https://gshaw.ca

# Build settings
markdown: kramdown

kramdown:
  input: GFM

include:
  - .well-known

exclude:
  - AGENTS.md
  - CLAUDE.md
  - cspell.config.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - vendor

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
